# ---------------------
# Publishing configuration
# ---------------------

publish:
  group-id: io.github.mflisar.toolbox
  github:
    user: MFlisar
    repo: maven-repository
    branch: main
    path: artifacts
  release-target: maven-central # [none, maven-central, github]
  test-target: github # [none, maven-central, github]

# ---------------------
# General configuration
# ---------------------

config:
  java-version: 17
  developer:
    name: Michael Flisar
    mail: mflisar.development@gmail.com
    maven-id: mflisar
    github-user-name: MFlisar

# ---------------------
# Project
# ---------------------

project:
  namespace: com.michaelflisar.toolbox
  repo-name: Toolbox
  release: 2021
  license:
    name: Apache License 2.0
    path: blob/main/LICENSE

# ---------------------
# APP / DEMO (optional)
# ---------------------

apps:
  - name: Toolbox Demo
    namespace: com.michaelflisar.toolbox.demo
    version:
      name: 0.0.3
      code: 3
    module-paths:
      - demo/app/android
      - demo/app/jvm
      - demo/app/wasm
      - demo/shared
    # optional - if set, the app will be published to the homepage and linked in the readme
    publish:
      url-path: demo
      description: Explore the interactive demo
      module-path: demo/app/wasm

# ---------------------
# Modules
# ---------------------

modules:
  # used to detect latest release version of the library (dynamically on the published homepage)
  primary-artifact-id: core
  # Modules - list of modules [artifact-id, description, path, (plugin)]
  modules:
    - artifact-id: core
      description: the core module
      path: library/core
    - artifact-id: app
      description: the styled app module
      path: library/app
    - artifact-id: zip
      description: a zip module
      path: library/modules/zip
    - artifact-id: csv
      description: a csv module
      path: library/modules/csv
    - artifact-id: backup
      description: a backup module
      path: library/modules/backup
    - artifact-id: service
      description: a service module
      path: library/modules/service
    - artifact-id: form
      description: a form module
      path: library/modules/form
    - artifact-id: powershell
      description: a powershell module
      path: library/modules/powershell
    - artifact-id: room
      description: provides room database classes
      path: library/modules/room
    - artifact-id: ads
      description: provides ads composables
      path: library/modules/ads
    - artifact-id: proversion
      description: provides proversion checker functions (via openiap)
      path: library/modules/proversion
    - artifact-id: diff
      description: diff functions and UI
      path: library/modules/diff
    - artifact-id: excel
      description: excel functions
      path: library/modules/excel
    - artifact-id: coil
      description: a coil module
      path: library/modules/coil
    - artifact-id: tasks
      description: a tasks module including a task viewer
      path: library/modules/tasks
  # XCFrameworks [name, path, targets (ios, macos)]
  xcframeworks: []

# ---------------------
# Readme Generation
# ---------------------

documentation:
  path: documentation
  relative-paths:
    partials: _partials
    screenshots: screenshots
    main-screenshot: # screenshots/main.png