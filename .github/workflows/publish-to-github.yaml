name: Publish Module to GitHub

on:
  workflow_dispatch:
    inputs:
      artifactId:
        description: Artifact ID
        required: true
        type: string

      version:
        description: Version
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - name: Checkout Library
        uses: actions/checkout@v4

      - name: Checkout MavenRepo
        uses: actions/checkout@v4
        with:
          repository: MFlisar/MavenRepo
          token: ${{ secrets.MFLISAR_MAVEN_REPO_TOKEN }}
          path: mavenRepo

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install yq
        run: |
          brew install yq

      - name: Resolve module
        id: module
        run: |
          ARTIFACT_ID="${{ inputs.artifactId }}"

          MODULE_PATH=$(yq -r \
            '.modules[] | select(."artifact-id" == "'"$ARTIFACT_ID"'") | .path' \
            configs/library-config.yaml)

          if [ -z "$MODULE_PATH" ] || [ "$MODULE_PATH" = "null" ]; then
            echo "Unknown artifact-id: $ARTIFACT_ID"
            exit 1
          fi

          MODULE_NAME=$(basename "$MODULE_PATH")

          if [ "$MODULE_PATH" = "library/core" ]; then
            GRADLE_PATH=":toolbox:core"
          elif [[ "$MODULE_PATH" == library/modules/* ]]; then
            GRADLE_PATH=":toolbox:modules:$MODULE_NAME"
          elif [[ "$MODULE_PATH" == library/app/shared ]]; then
            GRADLE_PATH=":toolbox:app:shared"
          elif [[ "$MODULE_PATH" == library/app/jre ]]; then
            GRADLE_PATH=":toolbox:app:jre"
          elif [[ "$MODULE_PATH" == library/app/jbr ]]; then
            GRADLE_PATH=":toolbox:app:jbr"
          else
            echo "Cannot determine gradle path for $MODULE_PATH"
            exit 1
          fi

          REPOSITORY_NAME=$(yq -r '.github.name' configs/library-config.yaml | tr '[:upper:]' '[:lower:]')
          MAVEN_FOLDER=$(yq -r '.github.name' configs/library-config.yaml)

          echo "module_path=$MODULE_PATH" >> $GITHUB_OUTPUT
          echo "module_name=$MODULE_NAME" >> $GITHUB_OUTPUT
          echo "gradle_path=$GRADLE_PATH" >> $GITHUB_OUTPUT
          echo "repository_name=$REPOSITORY_NAME" >> $GITHUB_OUTPUT
          echo "maven_folder=$MAVEN_FOLDER" >> $GITHUB_OUTPUT

      - name: Check version does not exist
        run: |
          if [ -d "mavenRepo/${{ steps.module.outputs.maven_folder }}/io/github/mflisar/${{ steps.module.outputs.repository_name }}/${{ inputs.artifactId }}/${{ inputs.version }}" ]; then
            echo "Version already exists"
            exit 1
          fi

      - name: Publish
        run: |
          ./gradlew \
            ${{ steps.module.outputs.gradle_path }}:publishAllPublicationsToLocalMavenRepoRepository
        env:
          VERSION: ${{ inputs.version }}

      - name: Verify publication output
        run: |
          find "${{ steps.module.outputs.module_path }}/build" -type d -name maven-repo

      - name: Copy artifacts
        run: |
          mkdir -p "mavenRepo/${{ steps.module.outputs.maven_folder }}"

          cp -R \
            "${{ steps.module.outputs.module_path }}/build/maven-repo/"* \
            "mavenRepo/${{ steps.module.outputs.maven_folder }}/"

      - name: Commit and Push
        run: |
          cd mavenRepo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Publish ${{ inputs.artifactId }} ${{ inputs.version }}"
          git push