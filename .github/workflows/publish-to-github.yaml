name: Publish Module to GitHub

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Artifact to publish
        type: choice
        required: true
        options:
          - form
          - task-viewer

      version:
        description: Version
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - name: Checkout Library
        uses: actions/checkout@v4

      - name: Checkout MavenRepo
        uses: actions/checkout@v4
        with:
          repository: MFlisar/MavenRepo
          token: ${{ secrets.MFLISAR_MAVEN_REPO_TOKEN }}
          path: mavenRepo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check version does not exist
        run: |
          if [ -d "mavenRepo/Toolbox/io/github/mflisar/toolbox/${{ inputs.artifact }}/${{ inputs.version }}" ]; then
            echo "Version already exists"
            exit 1
          fi

      - name: Publish
        run: |
          ./gradlew :toolbox:modules:${{ inputs.artifact }}:publishAllPublicationsToLocalMavenRepoRepository
        env:
          VERSION: ${{ inputs.version }}

      - name: Inspect task-viewer build
        run: |
          find toolbox/modules/task-viewer/build -type f | head -200

      - name: Copy artifacts
        run: |
          mkdir -p mavenRepo/Toolbox

          cp -R \
            toolbox/modules/${{ inputs.artifact }}/build/maven-repo/* \
            mavenRepo/Toolbox/

      - name: Commit and Push
        run: |
          cd mavenRepo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Publish ${{ inputs.artifact }} ${{ inputs.version }}"
          git push