name: Publish Module to GitHub

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Artifact
        required: true
        type: choice
        options:
          - form
          - task-viewer

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - name: Checkout Library
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to local repository
        run: |
          ./gradlew publishAllPublicationsToLocalMavenRepoRepository

      - name: Checkout MavenRepo
        uses: actions/checkout@v4
        with:
          repository: MFlisar/MavenRepo
          token: ${{ secrets.MAVEN_REPO_TOKEN }}
          path: mavenRepo

      - name: Copy artifacts
        run: |
          mkdir -p mavenRepo/Toolbox
          cp -R library/modules/${{ inputs.artifact }}/build/maven-repo/* mavenRepo/Toolbox/

      - name: Commit and Push
        run: |
          cd mavenRepo

          git config user.name github-actions
          git config user.email github-actions@github.com

          git add .

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Publish ${{ inputs.artifact }}"
          git push