name: Publish Module to GitHub

on:
  workflow_dispatch:
    inputs:
      artifactId:
        description: Artifact ID
        required: true
        type: choice
        options:
          - core
          - app-shared
          - app-jre
          - app-jbr
          - ui
          - ui-adaptive
          - zip
          - csv
          - backup
          - service
          - form
          - powershell
          - table
          - room
          - ads
          - proversion
          - diff
          - excel
          - coil
          - task-viewer

      version:
        description: Version
        required: true
        type: string

permissions:
  contents: write

env:
  MODULE_CONFIG: |
    core|library/core|:toolbox:core
    app-shared|library/app/shared|:toolbox:app:shared
    app-jre|library/app/jre|:toolbox:app:jre
    app-jbr|library/app/jbr|:toolbox:app:jbr
    ui|library/modules/ui|:toolbox:modules:ui
    ui-adaptive|library/modules/ui-adaptive|:toolbox:modules:ui-adaptive
    zip|library/modules/zip|:toolbox:modules:zip
    csv|library/modules/csv|:toolbox:modules:csv
    backup|library/modules/backup|:toolbox:modules:backup
    service|library/modules/service|:toolbox:modules:service
    form|library/modules/form|:toolbox:modules:form
    powershell|library/modules/powershell|:toolbox:modules:powershell
    table|library/modules/table|:toolbox:modules:table
    room|library/modules/room|:toolbox:modules:room
    ads|library/modules/ads|:toolbox:modules:ads
    proversion|library/modules/proversion|:toolbox:modules:proversion
    diff|library/modules/diff|:toolbox:modules:diff
    excel|library/modules/excel|:toolbox:modules:excel
    coil|library/modules/coil|:toolbox:modules:coil
    task-viewer|library/modules/task-viewer|:toolbox:modules:task-viewer

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - name: Checkout Library
        uses: actions/checkout@v4

      - name: Checkout MavenRepo
        uses: actions/checkout@v4
        with:
          repository: MFlisar/MavenRepo
          token: ${{ secrets.MFLISAR_MAVEN_REPO_TOKEN }}
          path: mavenRepo

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve module
        id: module
        run: |
          LINE=$(echo "$MODULE_CONFIG" | grep "^${{ inputs.artifactId }}|")

          if [ -z "$LINE" ]; then
            echo "Unknown artifact: ${{ inputs.artifactId }}"
            exit 1
          fi

          MODULE_PATH=$(echo "$LINE" | cut -d'|' -f2)
          GRADLE_PATH=$(echo "$LINE" | cut -d'|' -f3)

          echo "module_path=$MODULE_PATH" >> $GITHUB_OUTPUT
          echo "gradle_path=$GRADLE_PATH" >> $GITHUB_OUTPUT

      - name: Check version does not exist
        run: |
          if [ -d "mavenRepo/Toolbox/io/github/mflisar/toolbox/${{ inputs.artifactId }}/${{ inputs.version }}" ]; then
            echo "Version already exists"
            exit 1
          fi

      - name: Publish
        run: |
          ./gradlew \
            ${{ steps.module.outputs.gradle_path }}:publishAllPublicationsToLocalMavenRepoRepository
        env:
          VERSION: ${{ inputs.version }}

      - name: Verify publication output
        run: |
          find "${{ steps.module.outputs.module_path }}/build" \
            -type d \
            -name maven-repo

      - name: Copy artifacts
        run: |
          mkdir -p mavenRepo/Toolbox

          cp -R \
            "${{ steps.module.outputs.module_path }}/build/maven-repo/"* \
            mavenRepo/Toolbox/

      - name: Commit and Push
        run: |
          cd mavenRepo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Publish ${{ inputs.artifactId }} ${{ inputs.version }}"
          git push