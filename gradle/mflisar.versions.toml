[versions]

# general (local snapshot: "LOCAL-SNAPSHOT")
kmp-parcelize =             "2.0.0"
kmp-platformcontext =       "2.0.2"
kmp-mail =                  "1.0.0"
cachefileprovider =         "1.0.0"
kotpreferences =        	"4.0.1"
lumberjack =                "12.0.0"
composecolors =             "2.0.0"
composestyled =             "0.0.1-alpha41"

# plugins only
kmpicon =                   "1.0.0"
kmpdevtools =               "9.4.2" # use the "devTools" task to change the version

[plugins]

# general
# --

# plugins only
kmpdevtools-buildplugin =           { id = "io.github.mflisar.kmpdevtools.plugins-build-gradle",        version.ref = "kmpdevtools" }
kmpicon-plugin =                    { id = "io.github.mflisar.kmpicon.plugin",                          version.ref = "kmpicon" }

[libraries]

# general
kmp-parcelize =                                 { module = "io.github.mflisar.kmpparcelize:library", 	                            version.ref = "kmp-parcelize" }
kmp-platformcontext-core =                      { module = "io.github.mflisar.kmpplatformcontext:core", 	                        version.ref = "kmp-platformcontext" }
kmp-platformcontext-initializer =               { module = "io.github.mflisar.kmpplatformcontext:initializer", 	                    version.ref = "kmp-platformcontext" }
kmp-mail =                                      { module = "io.github.mflisar.kmpmail:library", 	                                version.ref = "kmp-mail" }
cachefileprovider =                             { module = "io.github.mflisar.cachefileprovider:library", 	                        version.ref = "cachefileprovider" }
kotpreferences-core =               			{ module = "io.github.mflisar.kotpreferences:core", 								version.ref = "kotpreferences" }
kotpreferences-storage-datastore =     			{ module = "io.github.mflisar.kotpreferences:storage-datastore",      				version.ref = "kotpreferences" }
kotpreferences-storage-keyvalue =     			{ module = "io.github.mflisar.kotpreferences:storage-keyvalue",      				version.ref = "kotpreferences" }
kotpreferences-encryption-aes =     			{ module = "io.github.mflisar.kotpreferences:encryption-aes",      					version.ref = "kotpreferences" }
kotpreferences-extension-compose =     		    { module = "io.github.mflisar.kotpreferences:extension-compose",      				version.ref = "kotpreferences" }
lumberjack-core =			        			{ module = "io.github.mflisar.lumberjack:core", 									version.ref = "lumberjack" }
lumberjack-logger-console =			        	{ module = "io.github.mflisar.lumberjack:logger-console", 	            			version.ref = "lumberjack" }
lumberjack-logger-file =			        	{ module = "io.github.mflisar.lumberjack:logger-file", 	            				version.ref = "lumberjack" }
lumberjack-extension-composeviewer =	    	{ module = "io.github.mflisar.lumberjack:extension-composeviewer", 					version.ref = "lumberjack" }
lumberjack-extension-feedback =	            	{ module = "io.github.mflisar.lumberjack:extension-feedback", 	        			version.ref = "lumberjack" }
composecolors-material =						{ module = "io.github.mflisar.composecolors:material",      						version.ref = "composecolors" }
composecolors-x11 =								{ module = "io.github.mflisar.composecolors:x11",      								version.ref = "composecolors" }
composecolors-material-palette =				{ module = "io.github.mflisar.composecolors:material-palette",      				version.ref = "composecolors" }
composecolors-x11-palette =						{ module = "io.github.mflisar.composecolors:x11-palette",      						version.ref = "composecolors" }

# styled
composestyled-core = { module = "io.github.mflisar.composestyled:core", version.ref = "composestyled" }
composestyled-foundation = { module = "io.github.mflisar.composestyled:foundation", version.ref = "composestyled" }
composestyled-cupertino-flat = { module = "io.github.mflisar.composestyled:cupertino-flat", version.ref = "composestyled" }
composestyled-cupertino-liquid = { module = "io.github.mflisar.composestyled:cupertino-liquid", version.ref = "composestyled" }
composestyled-fluent2 = { module = "io.github.mflisar.composestyled:fluent2", version.ref = "composestyled" }
